name: Docstring Coverage

# Advisory-only check: reports module-level and class-level docstring
# coverage for core modules. Does NOT block merge — posts results as
# a PR comment and step summary.

on:
  pull_request:
    paths:
      - "agent/**/*.py"
      - "gateway/**/*.py"
      - "hermes_cli/**/*.py"
      - "tools/**/*.py"
      - "run_agent.py"
      - "model_tools.py"
      - "cli.py"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: docstring-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docstring-coverage:
    name: Check docstring coverage (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install interrogate

      - name: Run docstring coverage
        id: coverage
        run: |
          # Core modules — target >=80% coverage
          interrogate \
            --group \
            --exclude-regexp "tests/" \
            --exclude-regexp "scripts/" \
            --exclude-regexp "optional-skills/" \
            --exclude-regexp "plugins/" \
            --exclude-regexp "ui-tui/" \
            --exclude-regexp "website/" \
            --exclude-regexp "environments/" \
            --omit-covered-files \
            agent/ gateway/ hermes_cli/ tools/ run_agent.py model_tools.py cli.py \
            2>&1 | tee docstring-coverage.txt || true

          # Extract percentage for summary
          PCT=$(grep -oP '\d+\.\d+%' docstring-coverage.txt | head -1 || echo "N/A")
          echo "percentage=$PCT" >> "$GITHUB_OUTPUT"

      - name: Post coverage summary
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7
        with:
          script: |
            const fs = require('fs');
            let report = '';
            try {
              report = fs.readFileSync('docstring-coverage.txt', 'utf8');
            } catch (e) {
              report = 'Coverage report unavailable';
            }
            const pct = '${{ steps.coverage.outputs.percentage }}' || 'N/A';
            const marker = '<!-- docstring-coverage -->';
            const body = marker + '\n## Docstring Coverage Report\n\n' +
              '**Overall coverage: ' + pct + '** (target ≥ 80%, advisory only)\n\n' +
              '<details><summary>Full report</summary>\n\n```\n' + report + '\n```\n</details>';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }