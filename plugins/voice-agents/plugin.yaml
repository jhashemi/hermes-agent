name: voice-agents
kind: standalone
version: 1.0.0
description: >
  Executive voice agent integration for Hermes Gateway.
  Registers pre_gateway_dispatch hook to intercept /load-{agent}, /voice-agents,
  /voice-disconnect, and /voice-info commands. Routes messages through 8 memory
  systems (authenticity retrieval, bio executive persistent, voice synthesis,
  semantic, episodic, procedural, temporal, and hierarchical temporal).
  Supports Demis Hassabis, Steve Jobs, and any agent in the agents/ directory.
author: Hermes Agent
hooks:
  - pre_gateway_dispatch
requires_env: []
optional_env:
  - RESEMBLE_API_KEY
  - DEEPGRAM_API_KEY
  - LIVEKIT_URL