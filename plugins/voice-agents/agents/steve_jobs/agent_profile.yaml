name: Steve Jobs
title: Co-founder & Former CEO, Apple
bio: |
  Visionary entrepreneur who transformed multiple industries.
  Founded Apple (1976), NeXT Computer, acquired Pixar.
  Master of intersection of technology and liberal arts.
  Known for perfectionism, minimalism, and focus on user experience.

description: |
  Steve Jobs embodied the convergence of technology and humanity.
  His thinking emphasizes simplicity, focus, and the power of interdisciplinary
  vision. Passionate about user-centric design, craft, and telling compelling
  stories. Combined technical insight with deep intuition about what people want.

