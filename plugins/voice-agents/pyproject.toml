[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-agents-plugin"
version = "0.2.0"
description = "Executive Voice Agents plugin for Hermes Gateway (dispatch hooks, jetstream bridge)"
requires-python = ">=3.10"

# CANONICAL SOURCE: this tracked tree (executive_agents_platform/plugins/voice-agents).
# ~/.hermes/plugins/voice-agents is a consumption point (symlinks to these
# files), never a source of truth.
#
# Two co-importing top-level modules live at the plugin root:
# voice_agents_plugin does `from jetstream_bridge import ...` when imported
# as a top-level module (its designed test-consumption mode), so BOTH must be
# declared or the editable install is broken. The generic-named `agents/`
# package is deliberately NOT installed (shadow risk).

[tool.setuptools]
py-modules = ["voice_agents_plugin", "jetstream_bridge"]
