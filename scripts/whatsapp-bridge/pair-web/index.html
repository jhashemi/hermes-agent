<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hermes — WhatsApp Pairing</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; padding: 0;
      background: #0b0d10; color: #e6e8eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    h1 { margin: 0 0 8px; font-size: 20px; font-weight: 600; letter-spacing: 0.02em; }
    .sub { color: #8a94a1; font-size: 13px; margin-bottom: 20px; }
    .card {
      background: #12161c; border: 1px solid #1e2530;
      border-radius: 16px; padding: 20px;
      display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    #qr {
      width: 320px; height: 320px;
      background: #fff; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    #qr img { width: 100%; height: 100%; display: block; }
    #status {
      margin-top: 16px; font-size: 14px; color: #b0bac6; text-align: center;
      min-height: 20px;
    }
    #status.ok  { color: #58d987; }
    #status.err { color: #f36f6f; }
    .steps {
      margin-top: 24px; max-width: 340px; color: #b0bac6; font-size: 13px; line-height: 1.55;
    }
    .steps b { color: #e6e8eb; }
    .foot { color: #55606d; font-size: 11px; margin-top: 24px; }
    .dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: #ffb020; margin-right: 6px; vertical-align: middle;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .dot.ok  { background: #58d987; animation: none; }
    .dot.err { background: #f36f6f; animation: none; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
  </style>
</head>
<body>
  <h1>Hermes — WhatsApp Pairing</h1>
  <div class="sub">Scan this code with WhatsApp on your phone</div>
  <div class="card">
    <div id="qr"><span style="color:#333;font-size:12px">waiting for QR…</span></div>
    <div id="status"><span class="dot" id="dot"></span><span id="msg">connecting…</span></div>
  </div>
  <div class="steps">
    On phone: <b>WhatsApp → Settings → Linked Devices → Link a Device</b>, then point camera at the code above. Page refreshes automatically until pairing completes.
  </div>
  <div class="foot" id="foot"></div>

<script>
async function tick() {
  try {
    const r = await fetch('state.json?t=' + Date.now(), {cache: 'no-store'});
    if (!r.ok) throw new Error('http ' + r.status);
    const s = await r.json();
    const dot = document.getElementById('dot');
    const msg = document.getElementById('msg');
    const foot = document.getElementById('foot');
    foot.textContent = 'updated ' + new Date(s.ts).toLocaleTimeString();
    if (s.state === 'connected') {
      dot.className = 'dot ok';
      document.getElementById('status').className = 'ok';
      msg.textContent = '✅ paired — you can close this page';
      document.getElementById('qr').innerHTML = '<span style="color:#333;font-size:14px">paired ✓</span>';
      return;  // stop polling
    }
    if (s.state === 'error') {
      dot.className = 'dot err';
      document.getElementById('status').className = 'err';
      msg.textContent = '❌ ' + (s.error || 'error');
    } else if (s.qr_seq > 0) {
      dot.className = 'dot';
      document.getElementById('status').className = '';
      msg.textContent = 'QR ready — scan on phone';
      const q = document.getElementById('qr');
      // Force img refresh by appending seq
      q.innerHTML = '<img src="qr.png?seq=' + s.qr_seq + '" alt="QR">';
    } else {
      msg.textContent = 'waiting for QR…';
    }
  } catch (e) {
    document.getElementById('msg').textContent = 'polling…';
  }
  setTimeout(tick, 1500);
}
tick();
</script>
</body>
</html>
